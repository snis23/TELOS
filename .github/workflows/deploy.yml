# main 에 올리면: 설치 → 타입 검사·린트·단위 테스트 → E2E → 빌드 → GitHub Pages 배포
# 테스트가 하나라도 실패하면 배포하지 않는다.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사 (타입·린트·단위 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (가짜 백엔드, 화면 크기 4가지)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: 빌드
    needs: [check, e2e]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets 확인
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY 를 넣어 주세요 (docs/setup.md 8단계)."
            exit 1
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_TELOS_FAKE_BACKEND: ""
      - name: 가짜 백엔드가 빠졌는지 확인
        run: |
          if grep -rl "telos-fake-backend" out/; then
            echo "::error::배포 빌드에 개발용 가짜 백엔드가 들어 있어요."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: 배포
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
